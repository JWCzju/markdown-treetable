name: Build and release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run prepare:release
      - name: Attest main bundle
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js
      - name: Attest stylesheet
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: styles.css
      - name: Attest manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: manifest.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" \
            --notes "Rich Treetable $GITHUB_REF_NAME: foldable Markdown groups and nested records, rich cell editing, column resizing, compact row display, and in-place settings refresh."
